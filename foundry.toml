[profile.default]
src = "."
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
# Scope to the chess-core + randomness/ZK work. The Treasure NFT marketplace, the SVG,
# and rating modules are unrelated (and Treasure* pulls the OZ upgradeable package);
# excluded from this build profile.
skip = ["lib/**", "Treasure*.sol", "DarkChess.sol", "ChessSVG.sol", "ChessRating.sol"]
