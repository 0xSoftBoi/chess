[package]
name    = "chess-guest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chess-guest"
path = "src/main.rs"

[dependencies]
risc0-zkvm = { version = "1", features = ["std"] }
shakmaty   = "0.27"
sha3       = "0.10"   # keccak256, matching the contract's movesHash convention
hex        = "0.4"
